<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f6f2e9" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#10172a" media="(prefers-color-scheme: dark)" />
		<!-- PWA: un manifest per idioma (src/routes/manifest-[lang].webmanifest). -->
		<link rel="manifest" href="/manifest-%paraglide.lang%.webmanifest" />
		<!-- Icones aquí (no a +layout.svelte) perquè també surtin als shells SPA de /app (ssr = false).
		     URL estables a /static (no data: URI) perquè els cercadors les puguin rastrejar. -->
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="Carnet de Cims" />
		<!-- Avís de beta amagat en aquesta sessió (BannerBeta.svelte): s'amaga abans de pintar. -->
		<script>
			try {
				if (sessionStorage.getItem('carnetdecims:beta-amagat') === '1')
					document.documentElement.setAttribute('data-beta-amagat', '');
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
